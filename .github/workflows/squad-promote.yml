name: Squad Promote (retired)

# Inherited Squad CLI workflow, kept report-only by owner decision.
# See docs/testing.md#release-automation. scripts/release-workflows.test.cjs
# fails if this file regains automatic triggers, token permissions, actions,
# credentials or branch-promotion/release/publication commands.
on:
  workflow_dispatch:

permissions: {}

jobs:
  report:
    name: Report retired branch promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write report-only summary
        run: |
          {
            echo '## Squad Promote is retired'
            echo
            echo 'This inherited workflow is report-only. Squad Pod does not promote changes through dev, preview or main branches, and this workflow does not merge, commit or push anything.'
            echo
            echo 'Changes reach `master` through reviewed pull requests; release candidates are the `squad-pod-vsix` artifacts uploaded by Squad Pod CI on `master`.'
            echo 'Marketplace publication is a separate, explicitly approved owner step: https://github.com/swigerb/squad-pod/issues/158'
          } >> "$GITHUB_STEP_SUMMARY"
