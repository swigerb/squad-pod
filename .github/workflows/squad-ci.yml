name: Squad Pod CI

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json
            standalone/package-lock.json

      - name: Install dependencies
        run: npm run install:all && npm ci --prefix standalone

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check-types

      - name: Unit tests
        run: npm run test:all

      - name: Build
        run: npm run build

      - name: Standalone observer types and boundary tests
        run: npm run check --prefix standalone && npm test --prefix standalone

      - name: Build and verify installed read-only observer
        run: npm run build --prefix standalone && npm run acceptance --prefix standalone

      - name: Verify installed owned native terminals
        run: npm run acceptance:terminals --prefix standalone
        env:
          TERMINAL_ARTIFACTS: ${{ runner.temp }}/owned-terminal-evidence

      - name: Retain installed terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: owned-terminal-${{ matrix.os }}
          path: ${{ runner.temp }}/owned-terminal-evidence
          if-no-files-found: ignore

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4
        with:
          name: squad-pod-vsix
          path: '*.vsix'
