name: Squad Release (retired)

# Inherited Squad CLI workflow, kept report-only by owner decision.
# See docs/testing.md#release-automation. scripts/release-workflows.test.cjs
# fails if this file regains automatic triggers, token permissions, actions,
# credentials or tag/release/publication commands.
on:
  workflow_dispatch:

permissions: {}

jobs:
  report:
    name: Report retired release automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write report-only summary
        run: |
          {
            echo '## Squad Release is retired'
            echo
            echo 'This inherited workflow is report-only. It does not check out code, run tests, create tags or GitHub releases, or publish packages.'
            echo
            echo 'Release candidates are the `squad-pod-vsix` artifacts uploaded by Squad Pod CI on `master`.'
            echo 'Marketplace publication is a separate, explicitly approved owner step: https://github.com/swigerb/squad-pod/issues/158'
          } >> "$GITHUB_STEP_SUMMARY"
